# QA tool rules. Edit values here; changes apply on the next run.

link_check:
  # Hosts treated as "internal" (relative links are always internal).
  internal_hosts: [www.opentext.com, opentext.com]
  # Links whose path ends with one of these extensions count as "resource" links.
  resource_extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, zip, csv, mp4]
  # HTTP statuses reported as broken. All 5xx are broken too.
  # 490 is what www.opentext.com returns for "Page Not Found".
  broken_statuses: [404, 410, 490]
  # Statuses that usually mean "blocked for automated checks", not broken. Check these manually.
  unverifiable_statuses: [401, 403, 429, 999]
  # Text in a response body that means a bot-protection challenge page, not the real page.
  bot_protection_markers: ["Incapsula", "_Incapsula_Resource", "cf-chl", "Attention Required"]
  timeout_ms: 15000      # per request
  retries: 1             # extra attempts after a timeout or connection error
  max_redirects: 10
  concurrency: 8         # links checked at the same time
  per_host_concurrency: 4
  # Bot protection (Cloudflare/Imperva) blocks automated checks on some OpenText sites.
  # Once OpenText's web team allowlists a request header for this tool, put the header NAME here
  # and set its secret VALUE in the QA_TOOL_ALLOWLIST_TOKEN environment variable (never in this file).
  allowlist_header: ""          # e.g. X-OT-QA-Tool
  allowlist_hosts: [opentext.com]   # the header is only sent to these hosts and their subdomains
  # Legacy Vidyard video URLs (links and embeds). A match on "pattern" gets "replacement" as the suggestion;
  # any other URL on an "other_hosts" host (or its subdomains) is flagged without a suggestion.
  legacy_video:
    pattern: 'https?://opentext\.hubs\.vidyard\.com/watch/([^?#/]+)'
    replacement: 'https://videos.opentext.com/watch/\1'
    other_hosts: [vidyard.com]
  # Links and embeds containing any of these (case-insensitive) must be reviewed or replaced.
  restricted_references: [community.opentext.com, microfocus, solutions/aviator]

# Severity (critical | major | minor | info) and status (issue = must fix, review = check by hand) per rule.
rules:
  L01: {name: Broken link, severity: critical, status: issue}
  L02: {name: Could not verify, severity: info, status: review}
  L03: {name: Permanent redirect, severity: minor, status: issue}
  L04: {name: Temporary redirect, severity: info, status: issue}
  L05: {name: Redirect chain, severity: major, status: issue}
  L06: {name: Legacy video URL, severity: major, status: issue}
  L07: {name: Restricted reference, severity: major, status: review}
  L08: {name: Absolute internal URL, severity: minor, status: issue}
  L09: {name: Empty link, severity: major, status: issue}
